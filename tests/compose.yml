services:
  app:
    image: cloud-sharelinkviewtracker:local
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: integration-admin
      NEXTCLOUD_ADMIN_PASSWORD: disposable-integration-password
      CLOUD_RECOVER_MANAGED_MAINTENANCE: "${CLOUD_RECOVER_MANAGED_MAINTENANCE:-0}"
      PAPERLESS_FORWARDER_MODE: live
      PAPERLESS_FORWARDER_USER: integration-admin
      PAPERLESS_FORWARDER_PATH: /Paperless
    volumes:
      - nextcloud:/var/www/html
      - cloud_runtime:/var/lib/cloud
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloud/healthcheck.sh"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
  cron:
    image: cloud-sharelinkviewtracker:local
    entrypoint: /usr/local/bin/cloud/cron.sh
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - nextcloud:/var/www/html
      - cloud_runtime:/var/lib/cloud

volumes:
  nextcloud:
  cloud_runtime: