#nextcloud
services:
  app:
    image: ghcr.io/mahn-ke/cloud-by-vincent:latest
    ports:
      - 2563:80
    volumes:
      - nextcloud:/var/www/html
      - cloud_runtime:/var/lib/cloud
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloud/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${POSTGRES_DB}
      - MYSQL_USER=${POSTGRES_USER}
      - MYSQL_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_HOST=database
      - OVERWRITEPROTOCOL=https
      - NC_maintenance_window_start=4
      - NC_default_phone_region=DE
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PAPERLESS_FORWARDER_MODE=${PAPERLESS_FORWARDER_MODE:-off}
      - PAPERLESS_FORWARDER_USER=${PAPERLESS_FORWARDER_USER:-58fedbd722dd85d1160332c4b8055fcf74f3b203615e3c5a0019f2d84c8e49a3}
      - PAPERLESS_FORWARDER_PATH=${PAPERLESS_FORWARDER_PATH:-/Paperless}
    links:
      - database
      - redis
    depends_on:
      - redis

  redis:
    image: redis:8.10.3-alpine
    restart: always
    command: redis-server

  database:
    image: mariadb:12.3.3-noble
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - database:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_DATABASE=${POSTGRES_DB}
      - MYSQL_USER=${POSTGRES_USER}
      - TZ=Europe/Berlin

  cron:
    image: ghcr.io/mahn-ke/cloud-by-vincent:latest
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_started
    volumes:
      - nextcloud:/var/www/html
      - cloud_runtime:/var/lib/cloud
    restart: unless-stopped
    entrypoint: /usr/local/bin/cloud/cron.sh
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PAPERLESS_FORWARDER_MODE=${PAPERLESS_FORWARDER_MODE:-off}
      - PAPERLESS_FORWARDER_USER=${PAPERLESS_FORWARDER_USER:-58fedbd722dd85d1160332c4b8055fcf74f3b203615e3c5a0019f2d84c8e49a3}
      - PAPERLESS_FORWARDER_PATH=${PAPERLESS_FORWARDER_PATH:-/Paperless}
      - PAPERLESS_URL=${PAPERLESS_URL:-https://paperless.by.vincent.mahn.ke}
      - PAPERLESS_API_TOKEN=${PAPERLESS_API_TOKEN:-}

volumes:
  nextcloud:
  database:
  cloud_runtime:
