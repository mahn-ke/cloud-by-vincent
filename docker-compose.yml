#nextcloud
services:
  app:
    image: ghcr.io/mahn-ke/cloud-by-vincent:latest
    ports:
      - 2563:80
    volumes:
      - nextcloud:/var/www/html
    healthcheck:
      test: ["CMD", "/usr/local/bin/cloud/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${POSTGRES_DB}
      - MYSQL_USER=${POSTGRES_USER}
      - MYSQL_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_HOST=database
      - OVERWRITEPROTOCOL=https
      - NC_maintenance_window_start=4
      - NC_default_phone_region=DE
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    links:
      - database
      - redis
    depends_on:
      - redis

  redis:
    image: redis:8.10.2-alpine
    restart: always
    command: redis-server

  database:
    image: mariadb:12.3.3-noble
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - database:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_PASSWORD=${POSTGRES_PASSWORD}
      - MYSQL_DATABASE=${POSTGRES_DB}
      - MYSQL_USER=${POSTGRES_USER}
      - TZ=Europe/Berlin

  cron:
    image: ghcr.io/mahn-ke/cloud-by-vincent:latest
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_started
    volumes:
      - nextcloud:/var/www/html
    restart: unless-stopped
    entrypoint: /usr/local/bin/cloud/cron.sh
    environment:
      - PHP_MEMORY_LIMIT=512M
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256

volumes:
  nextcloud:
  database:
